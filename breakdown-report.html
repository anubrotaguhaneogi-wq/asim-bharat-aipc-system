<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakdown Report | ASIM BHARAT AIPC SYSTEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0b1220;color:#fff;}
header{background:#0f172a;padding:15px;text-align:center;border-bottom:2px solid #dc2626;}
header h1{color:#22c55e;}
.container{max-width:700px;margin:auto;padding:15px;}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:15px;}
label{display:block;margin-top:12px;margin-bottom:5px;font-size:14px;}
input,select,textarea{width:100%;padding:10px;border:none;border-radius:8px;background:#0f172a;color:#fff;}
textarea{height:90px;resize:vertical;}
button{width:100%;padding:12px;margin-top:20px;background:#dc2626;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;}
button:disabled{opacity:.6;}
.back{display:block;text-align:center;margin-top:18px;color:#60a5fa;text-decoration:none;}
</style>
</head>
<body>

<header>
<h1>Breakdown Report</h1>
<p>Tea Garden Industrial Electrical Maintenance</p>
</header>

<div class="container">
<div class="card">

<label>Equipment ID</label>
<input type="text" id="equipmentId" placeholder="Example: MTR-001">

<label>Equipment Type</label>
<select id="equipmentType">
<option>Motor</option>
<option>PLC</option>
<option>VFD</option>
<option>Control Panel</option>
<option>Transformer</option>
<option>Generator</option>
<option>Substation</option>
</select>

<label>Breakdown Date</label>
<input type="date" id="breakdownDate">

<label>Breakdown Time</label>
<input type="time" id="breakdownTime">

<label>Priority</label>
<select id="priority">
<option>Low</option>
<option>Medium</option>
<option>High</option>
<option>Critical</option>
</select>

<label>Fault Description</label>
<textarea id="faultDescription" placeholder="Write fault details..."></textarea>

<label>Action Taken</label>
<textarea id="actionTaken" placeholder="Write action taken..."></textarea>

<label>Technician Name</label>
<input type="text" id="technicianName" placeholder="Enter technician name">

<button id="saveBtn" onclick="saveReport()">Submit Breakdown Report</button>

</div>
<a href="super-admin-dashboard.html" class="back">← Back to Dashboard</a>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<script>
requireLogin();

async function saveReport(){
  const btn = document.getElementById("saveBtn");
  const equipmentId = document.getElementById("equipmentId").value.trim();
  const faultDescription = document.getElementById("faultDescription").value.trim();

  if(!equipmentId || !faultDescription){
    alert("Equipment ID and Fault Description are required.");
    return;
  }

  const user = auth.currentUser;
  if(!user){
    alert("Please login first.");
    window.location.href = "login.html";
    return;
  }

  btn.disabled = true;
  try{
    await db.collection("breakdownReports").add({
      equipmentId: equipmentId,
      equipmentType: document.getElementById("equipmentType").value,
      breakdownDate: document.getElementById("breakdownDate").value,
      breakdownTime: document.getElementById("breakdownTime").value,
      priority: document.getElementById("priority").value,
      faultDescription: faultDescription,
      actionTaken: document.getElementById("actionTaken").value.trim(),
      technicianName: document.getElementById("technicianName").value.trim(),
      createdBy: user.uid,
      created: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert("Breakdown Report saved successfully.");
    location.reload();
  }catch(error){
    console.error("Save Error:", error);
    alert("Save failed: " + error.message);
    btn.disabled = false;
  }
}
</script>

</body>
</html>
