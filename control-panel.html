<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Control Panel | ASIM BHARAT AIPC SYSTEM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0b1220;color:white;}
header{
background:#0f172a;
padding:15px;
text-align:center;
border-bottom:2px solid #16a34a;
}
header h1{color:#22c55e;}
.container{padding:15px;}
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:15px;
}
.card{
background:#1e293b;
padding:18px;
border-radius:12px;
border:1px solid #334155;
text-align:center;
}
.ok{color:#22c55e;font-weight:bold;}
.warn{color:#f59e0b;font-weight:bold;}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}
.back{
display:block;
margin-top:15px;
text-align:center;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>Control Panel</h1>
<p>MCC & Industrial Electrical Control</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h3>MCC Panel</h3>
<p class="ok">Healthy</p>
</div>

<div class="card">
<h3>DOL Starter</h3>
<p class="ok">Running</p>
</div>

<div class="card">
<h3>Star-Delta</h3>
<p class="ok">Ready</p>
</div>

<div class="card">
<h3>Contactor</h3>
<p class="ok">Normal</p>
</div>

<div class="card">
<h3>Overload Relay</h3>
<p class="ok">Reset</p>
</div>

<div class="card">
<h3>Emergency Stop</h3>
<p class="warn">Standby</p>
</div>

</div>

<button onclick="alert('Control Panel Inspection Started')">
Start Inspection
</button>

<a href="super-admin-dashboard.html" class="back">
← Back to Dashboard
</a>

</div>

</body>
</html>
