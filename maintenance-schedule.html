<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maintenance Schedule | ASIM BHARAT AIPC SYSTEM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0b1220;color:#fff;}
header{
background:#0f172a;
padding:15px;
text-align:center;
border-bottom:2px solid #16a34a;
}
header h1{color:#22c55e;}
.container{padding:15px;}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
margin-bottom:15px;
}

.box{
background:#1e293b;
padding:12px;
border-radius:10px;
text-align:center;
border:1px solid #334155;
}

.box h2{color:#22c55e;font-size:22px;}

table{
width:100%;
border-collapse:collapse;
background:#1e293b;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
text-align:left;
font-size:13px;
}

th{
background:#0f172a;
color:#22c55e;
}

.ok{color:#22c55e;font-weight:bold;}
.due{color:#f59e0b;font-weight:bold;}
.overdue{color:#ef4444;font-weight:bold;}

button{
width:100%;
padding:12px;
margin-top:18px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.back{
display:block;
text-align:center;
margin-top:18px;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>Maintenance Schedule</h1>
<p>Tea Garden Preventive Maintenance Calendar</p>
</header>

<div class="container">

<div class="summary">
<div class="box"><h2>48</h2><p>Total Jobs</p></div>
<div class="box"><h2>35</h2><p>Completed</p></div>
<div class="box"><h2>9</h2><p>Due</p></div>
<div class="box"><h2>4</h2><p>Overdue</p></div>
</div>

<table>
<tr>
<th>Equipment</th>
<th>Next Date</th>
<th>Status</th>
</tr>

<tr>
<td>Motor MTR-001</td>
<td>05 Oct 2026</td>
<td class="ok">Scheduled</td>
</tr>

<tr>
<td>VFD-02</td>
<td>02 Oct 2026</td>
<td class="due">Due Soon</td>
</tr>

<tr>
<td>Transformer</td>
<td>28 Sep 2026</td>
<td class="overdue">Overdue</td>
</tr>

<tr>
<td>Generator DG-01</td>
<td>10 Oct 2026</td>
<td class="ok">Scheduled</td>
</tr>

</table>

<button onclick="alert('Maintenance Calendar Updated')">
Update Schedule
</button>

<a href="super-admin-dashboard.html" class="back">
← Back to Dashboard
</a>

</div>

</body>
</html>
