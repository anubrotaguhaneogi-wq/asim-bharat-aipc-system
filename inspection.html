<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Inspection | ASIM BHARAT AIPC SYSTEM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0b1220;color:#fff;}
header{background:#0f172a;padding:15px;text-align:center;border-bottom:2px solid #16a34a;}
header h1{color:#22c55e;}
.container{padding:15px;}
.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:15px;margin-bottom:15px;}
.item{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid #334155;}
.item:last-child{border-bottom:none;}
.item input{margin-right:10px;transform:scale(1.2);}
button{width:100%;padding:12px;margin-top:20px;background:#16a34a;color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;}
.back{display:block;text-align:center;margin-top:18px;color:#60a5fa;text-decoration:none;}
</style>
</head>
<body>

<header>
<h1>Daily Electrical Inspection</h1>
<p>Tea Garden Shift Electrician Checklist</p>
</header>

<div class="container">

<div class="card">
<h3>Daily Inspection Checklist</h3>

<div class="item"><input type="checkbox"><span>HT Panel Checked</span></div>
<div class="item"><input type="checkbox"><span>LT Panel Checked</span></div>
<div class="item"><input type="checkbox"><span>PLC Panel Checked</span></div>
<div class="item"><input type="checkbox"><span>Motor Running Status Checked</span></div>
<div class="item"><input type="checkbox"><span>VFD Fault Checked</span></div>
<div class="item"><input type="checkbox"><span>Transformer Checked</span></div>
<div class="item"><input type="checkbox"><span>Generator Checked</span></div>
<div class="item"><input type="checkbox"><span>Emergency Stop Tested</span></div>

</div>

<button onclick="alert('Inspection Report Saved')">Save Inspection Report</button>

<a href="super-admin-dashboard.html" class="back">← Back to Dashboard</a>

</div>

</html>
