<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIM BHARAT | Reset Password</title>

<link rel="stylesheet" href="style.css">

<style>
.reset-box{
max-width:430px;
margin:60px auto;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:22px;
border:1px solid rgba(255,255,255,.15);
}
.reset-box h2{
text-align:center;
margin-bottom:10px;
font-family:Orbitron,sans-serif;
color:#00E5FF;
}
.reset-box p{
text-align:center;
color:#BFD5D8;
margin-bottom:20px;
font-size:14px;
}
.reset-box input{
width:100%;
padding:14px;
margin:12px 0;
border:none;
border-radius:12px;
background:#1a2b34;
color:white;
}
.reset-box button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00E5FF,#00FF9D);
font-weight:bold;
cursor:pointer;
}
.back{
display:block;
text-align:center;
margin-top:18px;
color:#00E5FF;
text-decoration:none;
font-size:14px;
}
#status{
margin-top:15px;
text-align:center;
font-size:14px;
color:#00FF9D;
}
</style>

</head>
<body>

<div class="background-glow"></div>

<div class="reset-box">

<h2>PASSWORD RESET</h2>

<p>Enter your registered mobile number.</p>

<input type="text" id="mobile" placeholder="Registered Mobile Number">

<button onclick="resetPassword()">
SEND RESET LINK
</button>

<div id="status"></div>

<a class="back" href="login.html">← Back to Login</a>

</div>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>

</body>
</html>
