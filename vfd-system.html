<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFD System | ASIM BHARAT AIPC SYSTEM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0b1220;color:#fff;}
header{
background:#0f172a;
padding:15px;
text-align:center;
border-bottom:2px solid #16a34a;
}
header h1{color:#22c55e;}
.container{padding:15px;}

.summary{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
margin-bottom:15px;
}

.box{
background:#1e293b;
padding:12px;
border-radius:10px;
text-align:center;
border:1px solid #334155;
}

.box h2{
color:#22c55e;
font-size:22px;
}

table{
width:100%;
border-collapse:collapse;
background:#1e293b;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:10px;
border-bottom:1px solid #334155;
text-align:left;
font-size:13px;
}

th{
background:#0f172a;
color:#22c55e;
}

.run{color:#22c55e;font-weight:bold;}
.stop{color:#ef4444;font-weight:bold;}
.fault{color:#f59e0b;font-weight:bold;}

button{
width:100%;
padding:12px;
margin-top:18px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
font-size:15px;
}

.back{
display:block;
text-align:center;
margin-top:18px;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>VFD System</h1>
<p>Variable Frequency Drive Monitoring</p>
</header>

<div class="container">

<div class="summary">
<div class="box"><h2>12</h2><p>Total VFD</p></div>
<div class="box"><h2>10</h2><p>Running</p></div>
<div class="box"><h2>2</h2><p>Fault</p></div>
<div class="box"><h2>48Hz</h2><p>Average</p></div>
</div>

<table>
<tr>
<th>VFD</th>
<th>Hz</th>
<th>RPM</th>
<th>Status</th>
</tr>

<tr>
<td>VFD-01</td>
<td>50</td>
<td>1480</td>
<td class="run">Running</td>
</tr>

<tr>
<td>VFD-02</td>
<td>45</td>
<td>1320</td>
<td class="run">Running</td>
</tr>

<tr>
<td>VFD-03</td>
<td>0</td>
<td>0</td>
<td class="fault">Fault E-12</td>
</tr>

<tr>
<td>VFD-04</td>
<td>38</td>
<td>1125</td>
<td class="run">Running</td>
</tr>

</table>

<button onclick="alert('VFD Diagnostics Started')">
Run VFD Diagnostics
</button>

<a href="super-admin-dashboard.html" class="back">
← Back to Dashboard
</a>

</div>

</body>
</html>
