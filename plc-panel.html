<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLC Panel | ASIM BHARAT AIPC SYSTEM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0b1220;color:white;}
header{background:#0f172a;padding:15px;border-bottom:2px solid #16a34a;text-align:center;}
header h1{color:#22c55e;}
.container{padding:15px;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;}
.card{background:#1e293b;padding:18px;border-radius:12px;border:1px solid #334155;text-align:center;}
.ok{color:#22c55e;font-weight:bold;}
.warn{color:#f59e0b;font-weight:bold;}
button{
width:100%;
padding:12px;
margin-top:20px;
background:#16a34a;
color:white;
border:none;
border-radius:10px;
cursor:pointer;
}
.back{
display:block;
margin-top:15px;
text-align:center;
color:#60a5fa;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<h1>PLC Control Panel</h1>
<p>Tea Garden Industrial Electrical Maintenance</p>
</header>

<div class="container">

<div class="grid">

<div class="card">
<h3>PLC Status</h3>
<p class="ok">ONLINE</p>
</div>

<div class="card">
<h3>Input Signals</h3>
<p>24 Active</p>
</div>

<div class="card">
<h3>Output Signals</h3>
<p>18 Active</p>
</div>

<div class="card">
<h3>CPU Health</h3>
<p class="ok">NORMAL</p>
</div>

<div class="card">
<h3>Communication</h3>
<p class="ok">Connected</p>
</div>

<div class="card">
<h3>Fault Alarm</h3>
<p class="warn">No Active Fault</p>
</div>

</div>

<button onclick="alert('PLC Diagnostic Started')">Run Diagnostic</button>

<a href="super-admin-dashboard.html" class="back">← Back to Dashboard</a>

</div>

</body>
</html>
