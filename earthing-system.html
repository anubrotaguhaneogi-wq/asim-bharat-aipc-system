<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Earthing System | ASIM BHARAT AIPC SYSTEM</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#0b1220;color:#fff;}
header{background:#0f172a;padding:15px;text-align:center;border-bottom:2px solid #16a34a;}
header h1{color:#22c55e;}
.container{padding:15px;}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:15px;}
.box{background:#1e293b;padding:12px;border-radius:10px;text-align:center;border:1px solid #334155;}
.box h2{color:#22c55e;font-size:22px;}
table{width:100%;border-collapse:collapse;background:#1e293b;border-radius:12px;overflow:hidden;}
th,td{padding:10px;border-bottom:1px solid #334155;text-align:left;font-size:13px;}
th{background:#0f172a;color:#22c55e;}
.ok{color:#22c55e;font-weight:bold;}
.warn{color:#f59e0b;font-weight:bold;}
button{width:100%;padding:12px;margin-top:18px;background:#16a34a;color:white;border:none;border-radius:10px;font-size:15px;cursor:pointer;}
.back{display:block;text-align:center;margin-top:18px;color:#60a5fa;text-decoration:none;}
</style>
</head>

<body>

<header>
<h1>Earthing System</h1>
<p>Earth Pit & Earthing Inspection</p>
</header>

<div class="container">

<div class="summary">

<div class="box"><h2>Healthy</h2><p>Status</p></div>

</div>

</tr>

<tr>

</tr>

<tr>
<td>EP-03</td>
