<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIM BHARAT | Register</title>

<link rel="stylesheet" href="style.css">

<style>
.register-box{
  max-width:450px;
  margin:40px auto;
  padding:30px;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  border-radius:22px;
  border:1px solid rgba(255,255,255,.15);
}
.register-box h2{
  text-align:center;
  margin-bottom:20px;
  font-family:Orbitron,sans-serif;
  color:#00E5FF;
}
.register-box input,.register-box select{
  width:100%;
  padding:14px;
  margin:10px 0;
  border:none;
  border-radius:12px;
  background:#1a2b34;
  color:white;
}
.register-box option{ background:#1a2b34; color:white; }
.register-box button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:linear-gradient(90deg,#00E5FF,#00FF9D);
  font-weight:bold;
  cursor:pointer;
}
.note{
  text-align:center;
  margin-top:15px;
  font-size:14px;
  color:#BFD5D8;
}
.note a{ color:#00E5FF; text-decoration:none; }
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="register-box">

<h2>CREATE ACCOUNT</h2>

<input type="text" id="name" placeholder="Full Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<input type="email" id="email" placeholder="Email Address">
<input type="password" id="password" placeholder="Password">
<input type="password" id="confirmPassword" placeholder="Confirm Password">

<select id="role" onchange="checkCustomPost(this)">
<option value="" disabled selected>-- Select your post --</option>

<option value="core_admin">Core Admin (Manager / Sahib)</option>
<option value="assistant_manager_field">Assistant Manager (Field)</option>
<option value="assistant_manager_factory">Assistant Manager (Factory)</option>

<option value="head_babu">Head Babu / Bara Babu</option>
<option value="office_head_clerk">Office Head Clerk</option>
<option value="factory_head_clerk">Factory Head Clerk</option>
<option value="accountant">Accountant / Cashier</option>
<option value="pf_babu">Provident Fund (PF) Babu</option>
<option value="ration_babu">Ration Babu</option>
<option value="despatch_clerk">Despatch Clerk</option>

<option value="field_babu">Field Babu</option>
<option value="irrigation_babu">Irrigation Babu</option>
<option value="pesticide_medicine_babu">Pesticide and Medicine Babu</option>
<option value="nursery_incharge">Nursery Incharge</option>
<option value="plucking_supervisor">Plucking Supervisor</option>
<option value="sardar">Sardar</option>

<option value="fitter_babu">Fitter Babu (Mechanical)</option>
<option value="electrician_babu">Electrician Babu</option>
<option value="processing_babu">Factory Processing Babu</option>
<option value="withering_operator">Withering Section Operator</option>
<option value="drying_operator">Dryer Operator</option>
<option value="sorting_packing_babu">Sorting and Packing Babu</option>
<option value="generator_power_operator">Generator and Power Operator</option>

<option value="vehicle_transport_babu">Vehicle and Transport Babu</option>
<option value="tractor_driver">Tractor and Lorry Driver</option>

<option value="store_keeper">Store Keeper</option>
<option value="sub_store_babu">Sub-Store Babu</option>

<option value="garden_doctor">Garden Doctor / Medical Officer</option>
<option value="compounder_nurse">Compounder / Staff Nurse</option>
<option value="ambulance_driver">Ambulance Driver</option>

<option value="dhoba_babu">Dhoba (Laundry Service)</option>
<option value="napit_babu">Napit (Salon Service)</option>
<option value="school_teacher">Garden Primary School Teacher</option>
<option value="chowkidar_head">Head Chowkidar / Security Incharge</option>
<option value="labour">General Labour / Worker</option>

<option value="other_custom_post">+ Add another post...</option>
</select>

<!-- Shown only when "Add another post" is selected -->
<div id="customPostDiv" style="display:none;">
<input type="text" id="customPostName" placeholder="Type your post name here...">
</div>

<button onclick="register()">CREATE ACCOUNT</button>

<!-- Message area -->
<div id="status" class="note"></div>

<div class="note">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<!-- 1. Firebase SDK first -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>

<!-- 2. Config, 3. auth.js (do not change this order) -->
<script src="firebase-config.js"></script>
<script src="auth.js"></script>

<script>
  function checkCustomPost(selectObj) {
    var customDiv = document.getElementById('customPostDiv');
    customDiv.style.display = (selectObj.value === 'other_custom_post') ? 'block' : 'none';
  }
</script>

</body>
</html>
