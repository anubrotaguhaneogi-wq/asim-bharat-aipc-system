<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIM BHARAT | Register</title>

<link rel="stylesheet" href="style.css">

<style>
.register-box{
max-width:450px;
margin:40px auto;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(18px);
border-radius:22px;
border:1px solid rgba(255,255,255,.15);
}
.register-box h2{
text-align:center;
margin-bottom:20px;
font-family:Orbitron,sans-serif;
color:#00E5FF;
}
.register-box input,.register-box select{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
background:#1a2b34;
color:white;
}
.register-box button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00E5FF,#00FF9D);
font-weight:bold;
cursor:pointer;
}
.note{
text-align:center;
margin-top:15px;
font-size:14px;
color:#BFD5D8;
}
.note a{
color:#00E5FF;
text-decoration:none;
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="register-box">

<h2>CREATE ACCOUNT</h2>

<input type="text" id="name" placeholder="Full Name">

<input type="text" id="mobile" placeholder="Mobile Number">

<input type="email" id="email" placeholder="Email Address">

<input type="password" id="password" placeholder="Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<!-- চা বাগানের সুনির্দিষ্ট পদের ড্রপডাউন লিস্ট -->
<select id="role" onchange="checkCustomPost(this)">
<option value="" disabled selected>-- চা বাগানের পদ নির্বাচন করুন --</option>

<!-- কোর ম্যানেজমেন্ট ও অ্যাডমিন -->
<option value="core_admin">কোর অ্যাডমিন (ম্যানেজার / সাহেব)</option>
<option value="assistant_manager_field">অ্যাসিস্ট্যান্ট ম্যানেজার (ফিল্ড)</option>
<option value="assistant_manager_factory">অ্যাসিস্ট্যান্ট ম্যানেজার (ফ্যাক্টরি)</option>

<!-- হেড অফিস ও প্রধান বাবু বিভাগ -->
<option value="head_babu">বড়বাবু / হেড বাবু</option>
<option value="office_head_clerk">অফিস বড়বাবু (হেড ক্লার্ক)</option>
<option value="factory_head_clerk">ফ্যাক্টরি বড়বাবু</option>
<option value="accountant">একাউন্ট্যান্ট / ক্যাশিয়ার বাবু</option>
<option value="pf_babu">প্রভিডেন্ট ফান্ড (PF) বাবু</option>
<option value="ration_babu">রেশন বাবু</option>
<option value="despatch_clerk">ডিসপ্যাচ ক্লার্ক</option>

<!-- ফিল্ড অ্যাসিস্ট্যান্টের অধীনে থাকা বিভাগসমূহ -->
<option value="field_babu">ফিল্ড বড়বাবু / ক্ষেত বাবু</option>
<option value="irrigation_babu">ইরিগেশন (সেচ) বাবু</option>
<option value="pesticide_medicine_babu">ওষুধপত্র ও পেস্টিসাইড বাবু</option>
<option value="nursery_incharge">নার্সারি বাবু / ইনচার্জ</option>
<option value="plucking_supervisor">পাতা তোলার সুপারভাইজার</option>
<option value="sardar">সরদার / কামিন সর্দার</option>

<!-- ফ্যাক্টরি ও টেকনিক্যাল বিভাগ -->
<option value="fitter_babu">ফিটার বাবু (মেকানিক্যাল)</option>
<option value="electrician_babu">ইলেকট্রিশিয়ান বাবু</option>
<option value="processing_babu">ফ্যাক্টরি প্রসেসিং বাবু</option>
<option value="withering_operator">উইদারিং সেকশন অপারেটর</option>
<option value="drying_operator">ড্রায়ার অপারেটর</option>
<option value="sorting_packing_babu">সর্টিং ও প্যাকিং বাবু</option>
<option value="generator_power_operator">জেনারেটর ও পাওয়ার অপারেটর</option>

<!-- ভেহিকেল ও ট্রান্সপোর্ট -->
<option value="vehicle_transport_babu">ভেহিকেল ও মোটর ট্রান্সপোর্ট বাবু</option>
<option value="tractor_driver">ট্রাক্টর ও লরি ড্রাইভার</option>

<!-- স্টোর ও গুদাম বিভাগ -->
<option value="store_keeper">স্টোর কিপার (প্রধান গুদাম বাবু)</option>
<option value="sub_store_babu">সাব-স্টোর বাবু</option>

<!-- মেডিকেল ও হসপিটাল বিভাগ -->
<option value="garden_doctor">বাগান ডাক্তার / মেডিকেল অফিসার</option>
<option value="compounder_nurse">কম্পাউন্ডার / স্টাফ নার্স</option>
<option value="ambulance_driver">অ্যাম্বুলেন্স ড্রাইভার</option>

<!-- ওয়েলফেয়ার ও অন্যান্য সার্ভিস -->
<option value="dhoba_babu">ধোবাবাবু (লন্ড্রি সার্ভিস)</option>
<option value="napit_babu">নাপিত (সেলুন সার্ভিস)</option>
<option value="school_teacher">বাগান প্রাইমারি স্কুল শিক্ষক</option>
<option value="chowkidar_head">হেড চৌকিদার / সিকিউরিটি ইনচার্জ</option>
<option value="labour">সাধারণ লেবার / কর্মী</option>

<!-- ভবিষ্যতে নতুন পদ যোগ করার ফ্লেক্সিবল অপশন -->
<option value="other_custom_post" style="font-weight: bold; color: #00E5FF;">+ অন্য কোনো নতুন পদ যুক্ত করুন...</option>
</select>

<!-- যদি নতুন পদ সিলেক্ট করা হয়, তবে এই ইনপুট বক্সটি দেখা যাবে -->
<div id="customPostDiv" style="display: none;">
<input type="text" id="customPostName" placeholder="এখানে নতুন পদের নাম লিখুন...">
</div>

<button onclick="register()">CREATE ACCOUNT</button>

<div class="note">
Already have an account?
<a href="login.html">Login</a>
</div>

</div>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>
<script>
  // ড্রপডাউন থেকে 'অন্যান্য' সিলেক্ট করলে নতুন পদের ইনপুট বক্স ওপেন করার লজিক
  function checkCustomPost(selectObj) {
    const customDiv = document.getElementById('customPostDiv');
    if (selectObj.value === 'other_custom_post') {
      customDiv.style.display = 'block';
    } else {
      customDiv.style.display = 'none';
    }
  }
</script>

</body>
</html>
