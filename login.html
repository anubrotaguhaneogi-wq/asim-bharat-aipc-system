<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASIM BHARAT | Login</title>

<link rel="stylesheet" href="style.css">

<style>
.login-box{
max-width:420px;
margin:60px auto;
padding:30px;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
border-radius:22px;
border:1px solid rgba(255,255,255,.15);
}
.login-box h2{
text-align:center;
margin-bottom:20px;
font-family:Orbitron,sans-serif;
color:#00E5FF;
}
.login-box input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
border-radius:12px;
background:#1a2b34;
color:white;
}
.login-box button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#00E5FF,#00FF9D);
font-weight:bold;
cursor:pointer;
}
.links{
display:flex;
justify-content:space-between;
margin-top:15px;
font-size:14px;
}
.links a{
color:#BFD5D8;
text-decoration:none;
}
</style>
</head>

<body>

<div class="background-glow"></div>

<div class="login-box">

<h2>AI LOGIN</h2>

<input type="text" id="mobile" placeholder="Mobile Number">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">LOGIN</button>

<div class="links">
<a href="forgot-password.html">Forgot?</a>
<a href="register.html">Register</a>
</div>

</div>

<script src="firebase-config.js"></script>
<script src="auth.js"></script>

</body>
</html>
